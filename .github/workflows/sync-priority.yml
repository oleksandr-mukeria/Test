# ============================================================
# Sync Priority Label ↔ GitHub Project Field (Bidirectional)
# ============================================================
#
# REQUIRED SECRETS  (repo Settings → Secrets and variables → Actions → Secrets):
#   PROJECT_TOKEN   Classic PAT — see token scopes below
#
# REQUIRED VARIABLES  (repo Settings → Secrets and variables → Actions → Variables):
#   OWNER_NAME      Your org login OR personal GitHub username
#   OWNER_TYPE      "org" for organization projects, "user" for personal projects
#   PROJECT_NUMBER  Number from the project URL  (.../projects/NUMBER)
#   FIELD_NAME      Exact name of the single-select field in the project
#
# ── How it works ──────────────────────────────────────────────
#   Label  → Project   Instant. Fires when a P0/P1/P2 label is
#                       added/removed from an issue.
#
#   Project → Label    Polling. Runs every 15 min, scans all project
#                       items, and reconciles labels on linked issues.
#                       Change the cron below to adjust frequency.
# ============================================================

name: Sync Priority Label ↔ Project Field

on:
  issues:
    types: [labeled, unlabeled]

  schedule:
    - cron: '*/15 * * * *'   # Project → Label poll (minimum interval is '* * * * *')

  workflow_dispatch:
    inputs:
      direction:
        description: "Sync direction"
        required: true
        type: choice
        options:
          - label-to-project
          - project-to-label
      issue_number:
        description: "Issue number — required for label-to-project direction"
        required: false
        type: number

# ── Direction 1: Issue label changed → update Project field ──────────────────
jobs:
  label-to-project:
    name: "Label → Project Field"
    environment: dev
    if: |
      github.event_name == 'issues' ||
      (github.event_name == 'workflow_dispatch' && inputs.direction == 'label-to-project')
    runs-on: ubuntu-latest
    permissions:
      issues: read
    steps:
      - name: Sync priority label to project field
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const PRIORITIES  = ['P0', 'P1', 'P2'];
            const ownerName   = '${{ vars.OWNER_NAME }}';
            const ownerType   = '${{ vars.OWNER_TYPE }}';   // "org" or "user"
            const projectNum  = parseInt('${{ vars.PROJECT_NUMBER }}', 10);
            const fieldName   = '${{ vars.FIELD_NAME }}';

            // ── Resolve issue (event vs manual trigger) ────────────────────
            let issueNodeId, activeLabel, issueNumber;

            if (context.eventName === 'workflow_dispatch') {
              issueNumber = parseInt(context.payload.inputs.issue_number, 10);
              if (!issueNumber) {
                core.setFailed('issue_number input is required for label-to-project direction');
                return;
              }
              const { repository } = await github.graphql(`
                query($owner: String!, $repo: String!, $num: Int!) {
                  repository(owner: $owner, name: $repo) {
                    issue(number: $num) {
                      id
                      labels(first: 30) { nodes { name } }
                    }
                  }
                }
              `, { owner: context.repo.owner, repo: context.repo.repo, num: issueNumber });

              issueNodeId = repository.issue.id;
              activeLabel = repository.issue.labels.nodes
                .map(l => l.name).find(n => PRIORITIES.includes(n)) ?? null;
            } else {
              const issue = context.payload.issue;
              issueNumber = issue.number;
              issueNodeId = issue.node_id;
              activeLabel = issue.labels
                .map(l => l.name).find(n => PRIORITIES.includes(n)) ?? null;
            }

            core.info(`Issue #${issueNumber} — active priority label: ${activeLabel ?? '(none)'}`);

            // ── Fetch project metadata ─────────────────────────────────────
            const projectQuery = ownerType === 'org'
              ? `query($owner: String!, $num: Int!) {
                   organization(login: $owner) {
                     projectV2(number: $num) { id fields(first: 50) { nodes {
                       ... on ProjectV2SingleSelectField { id name options { id name } }
                     }}}
                   }
                 }`
              : `query($owner: String!, $num: Int!) {
                   user(login: $owner) {
                     projectV2(number: $num) { id fields(first: 50) { nodes {
                       ... on ProjectV2SingleSelectField { id name options { id name } }
                     }}}
                   }
                 }`;

            const projectData = await github.graphql(projectQuery, { owner: ownerName, num: projectNum });
            const project = (ownerType === 'org' ? projectData.organization : projectData.user).projectV2;
            const field   = project.fields.nodes.find(f => f.name === fieldName);

            if (!field) {
              core.setFailed(
                `Field "${fieldName}" not found. ` +
                `Available: ${project.fields.nodes.map(f => f.name).filter(Boolean).join(', ')}`
              );
              return;
            }

            // ── Find the project item linked to this issue ─────────────────
            const { node } = await github.graphql(`
              query($id: ID!) {
                node(id: $id) {
                  ... on Issue {
                    projectItems(first: 20) {
                      nodes { id project { id } }
                    }
                  }
                }
              }
            `, { id: issueNodeId });

            const projectItem = node.projectItems.nodes
              .find(item => item.project.id === project.id);

            if (!projectItem) {
              core.warning(`Issue #${issueNumber} is not in project #${projectNum} — skipping.`);
              return;
            }

            // ── Apply or clear the project field ───────────────────────────
            if (activeLabel) {
              const option = field.options.find(o => o.name === activeLabel);
              if (!option) {
                core.setFailed(
                  `Option "${activeLabel}" not found. ` +
                  `Available: ${field.options.map(o => o.name).join(', ')}`
                );
                return;
              }

              await github.graphql(`
                mutation($pid: ID!, $iid: ID!, $fid: ID!, $oid: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $pid
                    itemId: $iid
                    fieldId: $fid
                    value: { singleSelectOptionId: $oid }
                  }) { projectV2Item { id } }
                }
              `, { pid: project.id, iid: projectItem.id, fid: field.id, oid: option.id });

              core.info(`✅  Set "${fieldName}" → "${activeLabel}" for issue #${issueNumber}`);
            } else {
              await github.graphql(`
                mutation($pid: ID!, $iid: ID!, $fid: ID!) {
                  clearProjectV2ItemFieldValue(input: {
                    projectId: $pid
                    itemId: $iid
                    fieldId: $fid
                  }) { projectV2Item { id } }
                }
              `, { pid: project.id, iid: projectItem.id, fid: field.id });

              core.info(`✅  Cleared "${fieldName}" for issue #${issueNumber}`);
            }

# ── Direction 2: Poll project → reconcile Issue labels ───────────────────────
  project-to-label:
    name: "Project Field → Label (poll)"
    environment: dev
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.direction == 'project-to-label')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Poll project and sync labels
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const PRIORITIES = ['P0', 'P1', 'P2'];
            const ownerName  = '${{ vars.OWNER_NAME }}';
            const ownerType  = '${{ vars.OWNER_TYPE }}';   // "org" or "user"
            const projectNum = parseInt('${{ vars.PROJECT_NUMBER }}', 10);
            const fieldName  = '${{ vars.FIELD_NAME }}';

            // ── Paginate through all project items ─────────────────────────
            const itemsQuery = ownerType === 'org'
              ? `query($owner: String!, $num: Int!, $cursor: String) {
                   organization(login: $owner) { projectV2(number: $num) {
                     items(first: 100, after: $cursor) {
                       pageInfo { hasNextPage endCursor }
                       nodes {
                         content {
                           ... on Issue {
                             number
                             labels(first: 30) { nodes { name } }
                             repository { name owner { login } }
                           }
                         }
                         fieldValues(first: 30) { nodes {
                           ... on ProjectV2ItemFieldSingleSelectValue {
                             name
                             field { ... on ProjectV2SingleSelectField { name } }
                           }
                         }}
                       }
                     }
                   }}
                 }`
              : `query($owner: String!, $num: Int!, $cursor: String) {
                   user(login: $owner) { projectV2(number: $num) {
                     items(first: 100, after: $cursor) {
                       pageInfo { hasNextPage endCursor }
                       nodes {
                         content {
                           ... on Issue {
                             number
                             labels(first: 30) { nodes { name } }
                             repository { name owner { login } }
                           }
                         }
                         fieldValues(first: 30) { nodes {
                           ... on ProjectV2ItemFieldSingleSelectValue {
                             name
                             field { ... on ProjectV2SingleSelectField { name } }
                           }
                         }}
                       }
                     }
                   }}
                 }`;

            let cursor     = null;
            const allItems = [];

            do {
              const data = await github.graphql(itemsQuery, { owner: ownerName, num: projectNum, cursor });
              const page = (ownerType === 'org' ? data.organization : data.user).projectV2.items;
              allItems.push(...page.nodes);
              cursor = page.pageInfo.hasNextPage ? page.pageInfo.endCursor : null;
            } while (cursor);

            core.info(`Found ${allItems.length} project items`);

            // ── Reconcile labels for each linked issue ─────────────────────
            for (const item of allItems) {
              const issue = item.content;
              if (!issue?.number) continue;   // skip PRs and draft items

              const priorityFv = item.fieldValues.nodes
                .find(fv => fv.field?.name === fieldName);
              const projectPriority = priorityFv?.name ?? null;

              if (projectPriority && !PRIORITIES.includes(projectPriority)) continue;

              const owner         = issue.repository.owner.login;
              const repo          = issue.repository.name;
              const issueNumber   = issue.number;
              const currentLabels = issue.labels.nodes.map(l => l.name);

              const toRemove = currentLabels.filter(
                l => PRIORITIES.includes(l) && l !== projectPriority
              );
              const needsAdd = projectPriority && !currentLabels.includes(projectPriority);

              if (toRemove.length === 0 && !needsAdd) continue;   // already in sync

              for (const label of toRemove) {
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number: issueNumber, name: label,
                });
                core.info(`  🗑  #${issueNumber}: removed "${label}"`);
              }

              if (needsAdd) {
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: issueNumber, labels: [projectPriority],
                });
                core.info(`  🏷  #${issueNumber}: added "${projectPriority}"`);
              }
            }

            core.info('✅  Poll complete');
